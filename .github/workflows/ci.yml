name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install tmux

      - name: Check the tmux version
        run: tmux -V

      - name: Install the dependencies
        run: npm ci

      - name: Check the types
        run: npm run typecheck

      - name: Run the unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Run the integration tests
        run: npm run test:integration

      - name: Run the exit check
        run: npm run exit-check

      - name: Prove the install from git
        timeout-minutes: 10
        run: npm run install-check

      - name: Check the shell scripts
        if: runner.os == 'Linux'
        run: shellcheck scripts/*.sh
